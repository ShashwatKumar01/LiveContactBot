<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ContactBot Admin{% endblock %}</title>
  <style>
    :root { --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a; --text:#e4e6eb; --muted:#8b8fa3; --accent:#5b8def; --green:#3ecf8e; --red:#ef5b5b; --orange:#f5a623; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    nav { background:var(--card); border-bottom:1px solid var(--border); padding:0 24px; display:flex; align-items:center; gap:24px; height:56px; }
    nav a { color:var(--muted); text-decoration:none; font-size:14px; font-weight:500; }
    nav a:hover, nav a.active { color:var(--accent); }
    nav .brand { color:var(--text); font-weight:700; font-size:16px; margin-right:auto; }
    .container { max-width:1100px; margin:0 auto; padding:32px 24px; }
    h1 { font-size:24px; margin-bottom:24px; }
    h2 { font-size:18px; margin-bottom:16px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-bottom:32px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
    .card .label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
    .card .value { font-size:28px; font-weight:700; margin-top:4px; }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; border:1px solid var(--border); }
    th, td { padding:12px 16px; text-align:left; border-bottom:1px solid var(--border); font-size:14px; }
    th { background:#12141c; color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
    tr:last-child td { border-bottom:none; }
    .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:600; }
    .badge-green { background:#1a3d2b; color:var(--green); }
    .badge-red { background:#3d1a1a; color:var(--red); }
    .badge-orange { background:#3d2e1a; color:var(--orange); }
    .badge-blue { background:#1a2a3d; color:var(--accent); }
    .btn { display:inline-block; padding:8px 16px; border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:600; text-decoration:none; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-danger { background:var(--red); color:#fff; }
    .btn-sm { padding:4px 10px; font-size:12px; }
    .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
    form { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; max-width:600px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    input, select, textarea { width:100%; padding:10px 12px; background:#12141c; border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; margin-bottom:16px; }
    textarea { min-height:120px; resize:vertical; }
    .alert { padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:14px; }
    .alert-success { background:#1a3d2b; color:var(--green); border:1px solid #2a5d3b; }
    .alert-error { background:#3d1a1a; color:var(--red); border:1px solid #5d2a2a; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px; width:100%; max-width:400px; }
    .login-box h1 { text-align:center; margin-bottom:8px; }
    .login-box p { text-align:center; color:var(--muted); font-size:14px; margin-bottom:24px; }
    pre.msg-preview { background:#12141c; border:1px solid var(--border); border-radius:8px; padding:12px; font-size:13px; line-height:1.45; white-space:pre-wrap; word-break:break-word; margin-top:6px; max-height:280px; overflow:auto; }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
